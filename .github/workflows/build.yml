name: Build AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone ImmortalWrt
      run: |
        git clone --depth=1 -b v25.12.1 https://github.com/immortalwrt/immortalwrt.git source

    - name: Install dependency
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 rsync unzip

    - name: Feeds
      working-directory: source
      run: |
        cat ../feeds.conf.append >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy files
      run: |
        cp -r files source/

    - name: Config
      working-directory: source
      run: |
        cp ../.config .
        make defconfig

    - name: Compile
      working-directory: source
      run: |
        make download -j8
        make -j$(nproc)

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: AX6000-firmware
        path: source/bin/targets/mediatek/filogic/*
